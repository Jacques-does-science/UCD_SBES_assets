<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UCD SBES — Interactive Biology Assets</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0284c7;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    main {
      width: 100%;
      max-width: 720px;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
    }
    p.subtitle {
      margin: 0 0 2rem;
      color: var(--muted);
    }
    .grid {
      display: grid;
      gap: 1rem;
    }
    a.card {
      display: block;
      padding: 1.25rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    a.card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      color: var(--accent);
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>UCD SBES Interactive Assets</h1>
    <p class="subtitle">School of Biology and Environmental Science — Interactive 3D teaching resources</p>
    <div class="grid">
      <a class="card" href="./grasshopper_mouthparts/">
        <h2>GrasshopperBio 3D — Virtual Mouthparts Dissection Atlas</h2>
        <p>Interactive 3D dissection, exploded layers, virtual forceps, and lab quiz for <em>Romalea microptera</em> mandibulate mouthparts.</p>
      </a>
    </div>
  </main>
  <script data-goatcounter="https://ucd-sbes.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
